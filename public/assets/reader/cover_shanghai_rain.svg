<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="梅雨季的慢邮 表紙">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17253a"/>
      <stop offset="55%" stop-color="#2c4463"/>
      <stop offset="100%" stop-color="#4e697d"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2d3d"/>
      <stop offset="100%" stop-color="#111924"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>
  <!-- Distant Wukang/Postal Clocktower Silhouette -->
  <path d="M0 540 L0 360 L65 360 L65 320 L145 320 L145 375 L235 375 L235 280 L285 215 L335 280 L335 370 L460 355 L525 325 L600 345 L600 540 Z" fill="#182334" opacity="0.92"/>
  <circle cx="285" cy="288" r="16" fill="#fef3c7" opacity="0.72"/>
  <path d="M285 288 L285 278 M285 288 L293 291" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Plane tree branches -->
  <path d="M-20 120 Q120 165 210 245 Q130 220 40 245 Z" fill="#1b2b34" opacity="0.8"/>
  <path d="M620 90 Q470 155 395 235 Q485 205 620 220 Z" fill="#1b2b34" opacity="0.76"/>
  <!-- Wet street & Suzhou Creek reflection -->
  <rect x="0" y="540" width="600" height="260" fill="url(#road)"/>
  <ellipse cx="430" cy="450" rx="140" ry="140" fill="url(#lamp)"/>
  <!-- Vintage Postal Kiosk Window -->
  <rect x="370" y="405" width="120" height="145" rx="6" fill="#233044" stroke="#94a3b8" stroke-width="2"/>
  <rect x="386" y="422" width="88" height="72" rx="4" fill="#fef3c7" opacity="0.88"/>
  <path d="M386 458 L474 458 M430 422 L430 494" stroke="#b45309" stroke-width="2" opacity="0.65"/>
  <!-- Classic Green Postbox -->
  <rect x="135" y="472" width="44" height="78" rx="10" fill="#166534" stroke="#86efac" stroke-width="1.5"/>
  <rect x="143" y="492" width="28" height="6" rx="2" fill="#052e16"/>
  <!-- Warm reflection in puddles -->
  <ellipse cx="430" cy="625" rx="78" ry="18" fill="#fbbf24" opacity="0.28"/>
  <ellipse cx="430" cy="645" rx="45" ry="10" fill="#fef3c7" opacity="0.22"/>
  <!-- Diagonal Rain Streaks -->
  <g stroke="#cbd5e1" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
    <line x1="90" y1="60" x2="72" y2="128"/>
    <line x1="210" y1="110" x2="192" y2="175"/>
    <line x1="340" y1="80" x2="322" y2="145"/>
    <line x1="480" y1="140" x2="462" y2="205"/>
    <line x1="150" y1="260" x2="132" y2="330"/>
    <line x1="295" y1="350" x2="277" y2="418"/>
    <line x1="520" y1="290" x2="502" y2="358"/>
    <line x1="80" y1="420" x2="64" y2="482"/>
  </g>
  <!-- Floating Cream Letter Envelope Motif -->
  <g transform="translate(230 578) rotate(-5)">
    <rect x="0" y="0" width="142" height="92" rx="6" fill="#f8f3e6" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0 4 L71 54 L142 4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="71" cy="54" r="9" fill="#b91c1c"/>
  </g>
  <!-- Frame -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#e2e8f0" stroke-opacity="0.28" stroke-width="1.5" rx="10"/>
</svg>
